<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Konfigurátor Oceľových Garáží — Embed Kód</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0b0f17;
      color: #f1f5f9;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .embed-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #000;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 850px;
      border: none;
      display: block;
    }
    @media (max-width: 768px) {
      iframe {
        height: 700px;
      }
    }
  </style>
</head>
<body>

  <!-- Vloženie 3D Konfigurátora Garáží cez iFrame -->
  <div class="embed-container">
    <iframe 
      src="https://steel-shed-forge.vercel.app" 
      title="3D Konfigurátor Oceľových Garáží VBAU"
      allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      loading="lazy"
    ></iframe>
  </div>

</body>
</html>
